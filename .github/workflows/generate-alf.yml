name: Unity ALF 生成

on:
  workflow_call:
    inputs:
      platform:
        description: 'ALF を生成するプラットフォーム（Windows または Linux）'
        required: true
        type: string
      container-image:
        description: 'Linux ビルドに使用する Docker イメージ（platform が Linux の場合に必須）'
        required: false
        type: string
        default: ''
      runs-on-windows:
        description: 'Windows ジョブを実行するランナーラベル（JSON文字列または配列）'
        required: false
        type: string
        default: '["self-hosted", "Windows", "Unity"]'
      runs-on-linux:
        description: 'Linux ジョブを実行するランナーラベル（JSON文字列または配列）'
        required: false
        type: string
        default: '["self-hosted", "ubuntu"]'

jobs:
  generate-alf-windows:
    if: inputs.platform == 'Windows'
    runs-on: ${{ fromJson(inputs.runs-on-windows) }}
    steps:
      - name: Python をセットアップする
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: リポジトリをチェックアウトする
        uses: actions/checkout@v6

      - name: ALF を生成してアップロードする
        uses: surface0/unity-ci-actions/actions/generate-alf@v1

  generate-alf-linux:
    if: inputs.platform == 'Linux'
    runs-on: ${{ fromJson(inputs.runs-on-linux) }}
    container:
      image: ${{ inputs.container-image }}
    steps:
      - name: Python をセットアップする
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: リポジトリをチェックアウトする
        uses: actions/checkout@v6

      - name: ALF を生成してアップロードする
        uses: surface0/unity-ci-actions/actions/generate-alf@v1
