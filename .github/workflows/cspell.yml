name: スペルチェック

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'ジョブを実行するランナーラベル（JSON文字列または配列）'
        required: false
        type: string
        default: '"ubuntu-latest"'

jobs:
  cspell:
    name: スペルチェック
    runs-on: ${{ fromJson(inputs.runs-on) }}
    steps:
      - name: リポジトリをチェックアウトする
        uses: actions/checkout@v6

      - name: CSpell を実行する
        uses: surface0/unity-ci-actions/actions/cspell@v1
