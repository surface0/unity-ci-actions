name: 'Unity ALF ファイル生成'
description: '手動アクティベーション用の ALF ファイルを生成して artifact にアップロードする'
runs:
  using: "composite"
  steps:
    - name: ALF ファイルを生成する
      # ALF はワークスペースルート（Unity 実行ディレクトリ）に生成される
      run: python "$GITHUB_ACTION_PATH/../../scripts/activate.py" generate-alf
      shell: bash

    - name: ALF ファイルを artifact にアップロードする
      uses: actions/upload-artifact@v4
      with:
        name: unity-activation-file
        path: "*.alf"

    - name: 手動アクティベーション手順を表示する
      shell: bash
      run: |
        echo "=========================================="
        echo "  Unity 手動アクティベーション手順"
        echo "=========================================="
        echo ""
        echo "1. このワークフローの成果物 'unity-activation-file' をダウンロードします。"
        echo "2. https://license.unity3d.com/manual にアクセスします。"
        echo "3. Unity アカウントでサインインします。"
        echo "4. ダウンロードした .alf ファイルをアップロードします。"
        echo "5. シリアルキーを入力してアクティベーションを完了します。"
        echo "6. 生成された .ulf ファイルをダウンロードします。"
        echo "7. .ulf ファイルをランナー上の安全な場所に配置します。"
        echo ""
        echo "アクティベーションを実行するには:"
        echo "  python <ss-fleet-ciのパス>/scripts/activate.py activate --license-file <ulfファイルのパス>"
        echo "=========================================="