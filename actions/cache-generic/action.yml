name: '汎用キャッシュ'
description: '任意のディレクトリを cache.py を使って restore し、job 成功時にポストステップで自動 save する'
inputs:
  target-dir:
    description: 'キャッシュ対象のディレクトリ（プロジェクトルートからの相対パス）'
    required: true
  cache-key:
    description: 'キャッシュキー'
    required: true
  restore-keys:
    description: 'フォールバック用のキープレフィックス（カンマ区切り）'
    required: false
    default: ''
  skip-save:
    description: 'true にするとポストステップでの自動 save をスキップする'
    required: false
    default: 'false'
runs:
  using: 'node20'
  main: 'dist/main.js'
  post: 'dist/post.js'
  # job が成功したときだけ自動 save を実行する
  post-if: success()