name: 'サブモジュールチェックアウト'
description: 'GitHub App トークンを使ってプライベートリポジトリのサブモジュールをチェックアウトする'
inputs:
  app-id:
    description: 'GitHub App の ID'
    required: true
  private-key:
    description: 'GitHub App の秘密鍵'
    required: true
runs:
  using: "composite"
  steps:
    - name: GitHub App トークン生成
      uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: "ss-fleet-ci"

    - name: サブモジュール取得
      run: |
        git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "git@github.com:"
        git submodule update --init --recursive
      shell: bash
