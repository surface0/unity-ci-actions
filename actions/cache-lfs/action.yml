name: 'Cache Git LFS'
description: 'Cache Git LFS objects'
inputs:
  command:
    description: '"save" or "restore"'
    required: true
  cache-key:
    description: 'Cache key'
    required: true
runs:
  using: "composite"
  steps:
    - name: Run cache.py for Git LFS
      run: |
        if command -v cygpath > /dev/null 2>&1; then
          action_path=$(cygpath -u "${{ github.action_path }}")
        else
          action_path="${{ github.action_path }}"
        fi

        CACHE_DIR="$LFS_CACHE_DIR"
        if [ -z "$CACHE_DIR" ]; then
          CACHE_DIR="$PERSISTENT_CACHE_DIR"
        fi

        if [ -z "$CACHE_DIR" ]; then
          echo "::error::LFS_CACHE_DIR and PERSISTENT_CACHE_DIR are not set."
          exit 1
        fi

        if [ "${{ inputs.command }}" = "restore" ]; then
          python "$GITHUB_WORKSPACE/.github/ss-fleet-ci/scripts/cache.py" \
            --cache-dir "$CACHE_DIR" \
            restore \
            --target-dir .git/lfs \
            --cache-key "${{ inputs.cache-key }}" \
            --restore-keys "${{ inputs.cache-key }}"
        else
          python "$GITHUB_WORKSPACE/.github/ss-fleet-ci/scripts/cache.py" \
            --cache-dir "$CACHE_DIR" \
            save \
            --target-dir .git/lfs \
            --cache-key "${{ inputs.cache-key }}"
        fi
      shell: bash