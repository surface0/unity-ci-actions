name: 'CSpell スペルチェック'
description: 'cspell lint を実行し、エラー時に Step Summary にレポートを出力する'
inputs:
  config:
    description: 'cspell 設定ファイルのパス'
    required: false
    default: 'cspell.json'
runs:
  using: "composite"
  steps:
    - name: Run CSpell
      run: |
        npx --yes cspell lint --config ${{ inputs.config }} --no-progress > cspell-output.txt 2>&1 || {
          cat cspell-output.txt
          {
            echo "## Spell Check Failed"
            echo ""
            count=$(grep -c "Unknown word" cspell-output.txt || true)
            echo "スペルエラーが **${count} 件** 検出されました。"
            echo ""
            echo "| File | Line | Col | Word |"
            echo "|------|-----:|----:|------|"
            awk 'match($0, /^(.+):([0-9]+):([0-9]+) - Unknown word \((.+)\)/, a) { print "| `" a[1] "` | " a[2] " | " a[3] " | `" a[4] "` |" }' cspell-output.txt
          } >> $GITHUB_STEP_SUMMARY
          exit 1
        }
      shell: bash