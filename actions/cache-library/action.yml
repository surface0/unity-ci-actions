name: 'Unity Library キャッシュ'
description: 'Unity Library ディレクトリを Unity バージョン・ブランチごとに restore し、job 成功時にポストステップで自動 save する'
inputs:
  unity-version:
    description: 'Unity バージョン文字列（get-unity-version action の出力を渡す）'
    required: true
  skip-save:
    description: 'true にするとポストステップでの自動 save をスキップする'
    required: false
    default: 'false'
runs:
  using: 'node20'
  main: 'dist/main.js'
  post: 'dist/post.js'
  # job が成功したときだけ自動 save を実行する
  post-if: success()