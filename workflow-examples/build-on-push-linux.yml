name: Build on Push(Linux)

on:
  push:
    branches:
      - feature/build-ci # TODO: メインブランチ以外を対象にする場合はここを変更してください

jobs:
  build:
    runs-on: [self-hosted, ubuntu]
    container:
      image: registry.internal.syn-sophia.net/switch-gyro-camera-demo/unityci/editor:ubuntu-6000.3.4f1-linux-il2cpp-3.2.2-v1
      # ジョブコンテナで実行する場合は持続的キャッシュの保存先は明示的にマウントする必要がある
      volumes:
        - "/var/actions-runner-persistent-caches:/var/actions-runner-persistent-caches"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      # lfs: true は指定しない。LFS オブジェクトはキャッシュ復元後に差分取得する

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Git LFS Install
      run: git lfs install
      shell: bash

    # LFS キャッシュのセーブは lfs-cache-daily.yml のみで行う
    - name: Git LFS キャッシュを復元する
      uses: ./.github/ss-fleet-ci/actions/cache-lfs
      with:
        cache-key: ${{ github.event.repository.name }}-lfs
        skip-save: 'true'

    # キャッシュ復元後に差分だけ取得することで全件ダウンロードを回避する
    - name: Git LFS オブジェクトを差分取得する
      run: git lfs pull
      shell: bash

    - name: Unity バージョンを取得する
      id: get_unity_version
      uses: ./.github/ss-fleet-ci/actions/get-unity-version

    # job 成功時にポストステップで自動セーブされる
    - name: NuGet パッケージキャッシュを復元する
      uses: ./.github/ss-fleet-ci/actions/cache-generic
      with:
        target-dir: Packages/nuget-packages/InstalledPackages
        cache-key: ${{ github.event.repository.name }}-nuget-${{ hashFiles('Packages/nuget-packages/packages.config') }}
        restore-keys: ${{ github.event.repository.name }}-nuget-

    # job 成功時にポストステップで自動セーブされる
    - name: Unity Library キャッシュを復元する
      uses: ./.github/ss-fleet-ci/actions/cache-library
      with:
        unity-version: ${{ steps.get_unity_version.outputs.unity-version }}

    - name: Unity ライセンスを認証する
      uses: ./.github/ss-fleet-ci/actions/activate-unity-license
      with:
        license-content: ${{ secrets.UNITY_LICENSE_LINUX }}

    - name: Unity ビルドを実行する
      run: python .github/ss-fleet-ci/scripts/build.py --method BuildScript.BuildLinux --target StandaloneLinux64
      shell: bash