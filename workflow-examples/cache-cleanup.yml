name: Cache Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'  # 毎週日曜日 3:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete cache files older than this many days'
        required: false
        default: '14'

jobs:
  cleanup:
    strategy:
      matrix:
        runner: [linux-01, windows-01]
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    steps:
      - name: Purge old cache files
        run: |
          python "$GITHUB_WORKSPACE/.github/ss-fleet-ci/scripts/cache.py" \
            --cache-dir "$PERSISTENT_CACHE_DIR" \
            purge \
            --days ${{ inputs.days || 14 }}
        shell: bash
