name: Cache Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'  # 毎週日曜日 3:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete cache files older than this many days'
        required: false
        default: '14'

jobs:
  cleanup:
    uses: synSophia/ss-fleet-ci/.github/workflows/cache-cleanup.yml@main
    with:
      days: ${{ fromJSON(inputs.days || '14') }}
