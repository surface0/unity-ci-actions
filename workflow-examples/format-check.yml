name: Format Check

on:
  pull_request:

jobs:
  format:
    name: C# Format Check
    runs-on: [self-hosted, ubuntu]
    container:
      image: registry.internal.syn-sophia.net/switch-gyro-camera-demo/unityci/editor:ubuntu-6000.3.4f1-linux-il2cpp-3.2.2-v1
      volumes:
        - "/var/actions-runner-persistent-caches:/var/actions-runner-persistent-caches"

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Restore NuGet Packages Cache
        uses: ./.github/ss-fleet-ci/actions/cache-generic
        with:
          command: restore
          target-dir: Packages/nuget-packages/InstalledPackages
          cache-key: ${{ github.event.repository.name }}-nuget-${{ hashFiles('Packages/nuget-packages/packages.config') }}
          restore-keys: ${{ github.event.repository.name }}-nuget-

      - name: Get Unity Version
        id: get_unity_version
        uses: ./.github/ss-fleet-ci/actions/get-unity-version

      - name: Restore Unity Library Cache
        uses: ./.github/ss-fleet-ci/actions/cache-library
        with:
          command: restore
          unity-version: ${{ steps.get_unity_version.outputs.unity-version }}

      - name: Activate Unity License
        uses: ./.github/ss-fleet-ci/actions/activate-unity-license
        with:
          license-content: ${{ secrets.UNITY_LICENSE_LINUX }}

      - name: Generate Solution File
        # Packages.Rider.Editor.RiderScriptEditor.SyncSolution はコマンドライン用に公式提供されているstaticメソッド。
        # UnityEditor.SyncVS.SyncSolution と異なり EditorPrefs の External Script Editor 設定に依存しない。
        # 動作には Packages/manifest.json に com.unity.ide.rider が含まれている必要がある。
        run: python .github/ss-fleet-ci/scripts/build.py --method Packages.Rider.Editor.RiderScriptEditor.SyncSolution --target StandaloneLinux64
        shell: bash

      - name: Check Formatting
        run: |
          if ! dotnet format --verify-no-changes SwitchGyroCameraDemo.sln --include Assets/Scripts/ --report format-report.json; then
            {
              echo "## Format Check Failed"
              echo ""
              count=$(jq '[.[].FileChanges[]] | length' format-report.json)
              echo "フォーマットエラーが **${count} 件** 検出されました。"
              echo ""
              echo "| File | Line | Col | Rule | Description |"
              echo "|------|-----:|----:|------|-------------|"
              jq -r '.[] | .FilePath as $file | .FileChanges[] | "| `\($file)` | \(.LineNumber) | \(.CharNumber) | `\(.DiagnosticId)` | \(.FormatDescription) |"' format-report.json
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        shell: bash
