name: Generate Unity ALF

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'プラットフォーム'
        required: true
        type: choice
        options:
          - Windows
          - Linux

jobs:
  generate:
    uses: synSophia/ss-fleet-ci/.github/workflows/generate-alf.yml@main
    with:
      platform: ${{ inputs.platform }}
      container-image: registry.internal.syn-sophia.net/<project>/unityci/editor:<tag>  # TODO: イメージを変更してください（Linux の場合に使用）
